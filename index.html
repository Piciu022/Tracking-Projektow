<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Projekty — panel przeglądowy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Projekty</h1>
      <p class="subtitle">Co robię i co te narzędzia potrafią</p>
    </div>
  </header>

  <main class="container">
    <section id="projects" class="projects-grid" aria-label="Projekty"></section>

    <section class="feed-section" aria-label="Surowa historia commitów">
      <button class="toggle-feed" type="button" aria-expanded="false">
        Szczegóły techniczne (surowe commity, wszystkie projekty) ▾
      </button>
      <ol id="feed" class="feed-list" hidden></ol>
    </section>
  </main>

  <footer class="footer">
    <p>Opisy projektów i funkcji pisane ręcznie. Historia commitów (w szczegółach technicznych) generowana automatycznie.</p>
  </footer>

  <template id="project-card-template">
    <article class="project-card">
      <div class="project-card-head">
        <h3 class="project-name"></h3>
        <span class="status-badge"></span>
      </div>
      <p class="project-description"></p>
      <div class="tech-chips"></div>

      <div class="summary-block" hidden>
        <div class="summary-head">
          <span class="summary-icon">📋</span>
          <span class="summary-title">Co nowego</span>
          <span class="summary-period"></span>
        </div>
        <p class="summary-text"></p>
        <button class="toggle-older-summaries" type="button" aria-expanded="false" hidden>
          Starsze podsumowania ▾
        </button>
        <ol class="older-summaries" hidden></ol>
      </div>

      <div class="features-block" hidden>
        <div class="features-title">🧩 Funkcje</div>
        <ol class="features-list"></ol>
      </div>

      <div class="waiting-on" hidden>
        <span class="waiting-icon">🚧</span>
        <span class="waiting-text"></span>
      </div>

      <div class="project-actions">
        <a class="github-link" target="_blank" rel="noopener">Repozytorium na GitHubie ↗</a>
      </div>
    </article>
  </template>

  <template id="feature-item-template">
    <li class="feature-item">
      <div class="feature-head">
        <span class="feature-bullet">▪</span>
        <span class="feature-name"></span>
      </div>
      <p class="feature-description"></p>
      <ul class="feature-added"></ul>
    </li>
  </template>

  <template id="older-summary-template">
    <li class="older-summary-item">
      <span class="older-summary-period"></span>
      <p class="older-summary-text"></p>
    </li>
  </template>

  <template id="feed-item-template">
    <li class="feed-item">
      <span class="feed-icon"></span>
      <div class="feed-body">
        <a class="feed-subject" target="_blank" rel="noopener"></a>
        <div class="feed-meta"></div>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
