# Lista śledzonych projektów. Dodanie nowego projektu = dodanie kolejnego wpisu tutaj.
#
# Kod źródłowy tych projektów może być całkowicie prywatny - scripts/update_data.py czyta go
# WYŁĄCZNIE lokalnie z dysku (local_path), nigdy przez GitHub API, więc nie trzeba żadnego
# tokena. Jawnie publiczny jest tylko dashboard (to repo), nie śledzone projekty.
#
# local_path: ścieżka na tym Macu do lokalnego klonu (relatywnie do tego repo).
# github/branch: używane tylko do zbudowania linku do commita (https://github.com/<github>/commit/<sha>)
# - jeśli repo jest prywatne, taki link po prostu nie zadziała dla kogoś bez dostępu.
projects:
  - id: codeshare-assistant
    name: "Codeshare Assistant"
    description: >
      Aplikacja Streamlit (Databricks App) do analizy połączeń codeshare. Obecnie mapa bazowa
      (BaseMap), w planach słownik minimalnych czasów przesiadki i automatyczne dopasowywanie
      połączeń.
    status: aktywny
    tech: ["Python", "Streamlit", "Databricks Apps"]
    github: "Piciu022/Codeshare-assistant"
    branch: "main"
    history_limit: 100
    local_path: "../Codeshare"

  - id: slots-monitoring
    name: "Slots Monitoring (DOR App)"
    description: >
      Dashboard do monitorowania wykonania slotów i rejsów - czasy blokowe, kody i przyczyny
      opóźnień, filtry dat i lotnisk, wykrywanie systematycznych przekroczeń bloku.
    status: aktywny
    tech: ["Python", "Streamlit"]
    github: "Piciu022/Slots_Monitoring"
    branch: "dev"
    history_limit: 100
    local_path: "../Slots_Monitoring"

  - id: slots-mk
    name: "Slots Tracker"
    description: >
      Narzędzie dla działu koordynacji slotów LOT/WAW: porównywanie wersji plików
      rozkładowych i slotowych (klasyfikacja zmian wg kodów IATA SCR), analiza obłożenia
      limitów dzień/noc na WAW, ciągłe porównanie planu LOT z faktycznie przyznanymi slotami
      (Outstation Slots), sprawdzanie NOTAM na żywo vs rozkład, trwałe archiwum plików.
    status: aktywny
    tech: ["Python", "Streamlit", "Databricks Apps"]
    github: "Piciu022/Slots_MK"
    branch: "main"
    history_limit: 100
    local_path: "../Slots_MK/app"

  # Poniższe dwa panele nie mają (jeszcze) lokalnego repo - brak local_path oznacza, że
  # scripts/update_data.py nie próbuje czytać drzewa commitów, tylko pokazuje sam kafelek +
  # ewentualne ręczne podsumowania z data/summaries.json (Krok C w CLAUDE.md).
  - id: zmiany-rozkladowe
    name: "Zmiany Rozkładowe"
    description: >
      Szczegóły w przygotowaniu.
    status: aktywny
    tech: []

  - id: avih-pnr-check
    name: "AVIH / PNR - Check"
    description: >
      Szczegóły w przygotowaniu.
    status: aktywny
    tech: []
